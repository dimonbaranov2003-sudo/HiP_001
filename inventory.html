<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
<meta content="#F4ECDF" name="theme-color"/>
<title>Инвентаризация · Хачо и Пури</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#F4ECDF;
    --surface:#FBF9F8;
    --surface-2:#F3EDEC;
    --ink:#332C2C;
    --muted:#6D6262;
    --line:#DED4D2;
    --accent:#B7A8A8;
    --accent-ink:#6B5858;
    --copper:#8F5A2C;
    --copper-soft:#C88A4E;
    --new:#FFC000;
    --spec:#92D050;
    --warn:#A8452F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  [hidden]{display:none !important;}
  body{
    background-color:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif;}

  /* Шапка — обычный блок без fixed/sticky: во встроенных браузерах (Telegram) они ведут себя нестабильно. */
  header.topbar{border-bottom:1px solid var(--line); padding:14px 14px 12px;}
  .brand{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:14px; text-align:center;}
  .brand h1{
    margin:0; font-family:'Manrope',sans-serif; font-weight:800; font-size:1.2rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--ink); line-height:30px;
  }
  .brand .tag{
    font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.09em;
    color:var(--muted); text-transform:uppercase;
  }
  .back-btn{
    position:absolute; left:-10px; top:-7px; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-ink); text-decoration:none; -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
  }
  .back-btn svg{width:11px; height:19px; display:block;}
  .back-btn:active{transform:translateX(-2px);}

  .val:focus, #q:focus{border-color:var(--accent-ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent);}

  .pills{display:flex; gap:8px;}
  .pill{
    flex:1; font:700 .8rem 'Manrope',sans-serif; padding:10px 10px; border-radius:9px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px; -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .pill .n{font-family:'IBM Plex Mono',monospace; font-size:.66rem; font-weight:600; opacity:.7;}
  .pill.on{background:var(--accent-ink); border-color:var(--accent-ink); color:#fff;}
  @media (hover:hover){ .pill:not(.on):hover{border-color:var(--accent-ink);} }

  main{padding:14px; max-width:560px; margin:0 auto;}
  .search-row{margin-bottom:12px;}
  #q{
    width:100%; font:600 .95rem 'Manrope',sans-serif; color:var(--ink); background:var(--surface);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 14px; outline:none; -webkit-appearance:none; appearance:none;
  }
  #q::placeholder{color:var(--muted); font-weight:500;}

  .note-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:14px; font-size:.8rem; line-height:1.5; color:var(--muted);
  }
  .note-box b{color:var(--ink); font-weight:700;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:7px; font-size:.72rem;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:11px; height:11px; border-radius:3px; display:inline-block;}
  .legend .l-new i{background:var(--new);} .legend .l-spec i{background:var(--spec);}

  section.group{margin-bottom:22px;}
  .cat-head{display:flex; align-items:center; gap:8px; margin:0 0 8px 2px;}
  .cat-head .dot{width:10px; height:10px; border-radius:50%; background:var(--dot);}
  .cat-head h2{font-size:1.08rem; font-weight:700; margin:0; letter-spacing:-.01em; color:var(--ink);}
  .cat-head .n{font-family:'IBM Plex Mono',monospace; font-size:.7rem; color:var(--muted);}
  .cat-note{font-size:.76rem; color:var(--muted); line-height:1.5; margin:0 2px 10px;}

  .row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--dot);
    border-radius:8px; margin-bottom:6px; padding:6px 8px 6px 12px; min-height:50px; cursor:text;
    transition:background .15s ease, border-color .15s ease;
  }
  .row.filled{background:#fff; border-color:color-mix(in srgb, var(--dot) 45%, var(--line)); border-left-color:var(--dot);}
  .nm{font-family:'Fraunces',serif; font-size:.98rem; font-weight:500; line-height:1.25; min-width:0; overflow-wrap:anywhere;}
  .tg{
    display:inline-block; margin-left:7px; vertical-align:2px; font-style:normal;
    font-family:'IBM Plex Mono',monospace; font-size:.58rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    color:#3a3a3a; border-radius:4px; padding:1px 5px;
  }
  .tg.new{background:var(--new);} .tg.spec{background:var(--spec);}
  .fld{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .val{
    width:92px; font:500 1.05rem 'IBM Plex Mono',monospace; color:var(--ink); text-align:right;
    background:var(--bg); border:1.5px solid var(--line); border-radius:8px; padding:9px 10px; min-height:42px;
    outline:none; -webkit-appearance:none; appearance:none;
  }
  .val::placeholder{color:var(--accent); opacity:1;}
  .row.filled .val{border-color:var(--copper-soft); background:#fff;}
  .u{font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--muted); width:26px;}
  .empty{text-align:center; color:var(--muted); font-size:.9rem; padding:30px 0; font-style:italic;}

  /* ---------- Отправка ---------- */
  .send{margin-top:8px; padding-top:16px; border-top:1px solid var(--line);}
  .sum{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--muted); margin-bottom:10px; line-height:1.5;}
  .msg{
    font-size:.82rem; line-height:1.5; border-radius:10px; padding:10px 12px; margin-bottom:12px;
    background:color-mix(in srgb, var(--warn) 9%, var(--surface)); border:1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); color:var(--ink);
  }
  .msg.ok{background:color-mix(in srgb, #5C8A63 12%, var(--surface)); border-color:color-mix(in srgb, #5C8A63 45%, var(--line));}
  .btn{
    display:block; width:100%; font:700 .95rem 'Manrope',sans-serif; color:var(--ink);
    background:var(--surface); border:1.5px solid var(--accent); border-radius:10px; padding:14px 12px; margin-bottom:8px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; min-height:50px;
  }
  .btn.primary{background:var(--copper); border-color:var(--copper); color:#fff;}
  .btn.ghost{background:transparent; border-color:var(--line); color:var(--muted); font-weight:600; font-size:.85rem; min-height:44px; padding:11px 12px;}
  .btn.danger.arm{border-color:var(--warn); color:var(--warn);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible, .pill:focus-visible, .back-btn:focus-visible{outline:3px solid color-mix(in srgb, var(--accent-ink) 55%, transparent); outline-offset:2px;}
  #copybox{width:100%; min-height:120px; font:500 .8rem 'IBM Plex Mono',monospace; border:1.5px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; background:var(--surface); color:var(--ink);}

  footer{max-width:560px; margin:30px auto 0; padding:0 18px; color:var(--muted); font-size:.74rem; line-height:1.5; text-align:center;}
  .sig{border:none; padding:0; margin-top:8px; text-align:center;}
  .sig-input{position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0; clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;}
  .sig-name{display:inline-block; cursor:pointer; padding:4px 3px; -webkit-tap-highlight-color:transparent; transition:opacity .2s ease;}
  .sig-logo{height:24px; width:auto; display:block; filter:brightness(.66) saturate(1.15);}
  .sig-reveal{
    display:flex; flex-direction:column; align-items:center; gap:4px; max-height:0; opacity:0; filter:blur(6px);
    transform:translateY(-4px) scale(.96); overflow:hidden; pointer-events:none;
    transition:max-height 1.15s cubic-bezier(.16,1,.3,1), opacity 1.05s ease .12s, filter 1.05s ease .12s, transform 1.1s cubic-bezier(.16,1,.3,1) .08s;
  }
  .sig-input:checked ~ .sig-reveal{max-height:70px; opacity:1; filter:blur(0); transform:translateY(0) scale(1); pointer-events:auto; margin-top:6px;}
  .sig-tg{font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:.8rem; letter-spacing:.03em; color:#6E4727; text-decoration:none; border-bottom:1px dotted rgba(110,71,39,.45);}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

  <div class="brand">

  <div id="app"></div>
  <p class="empty" id="empty" hidden>Ничего не найдено</p>

  <section class="send" id="send">

</main>

<footer class="sig">

  <div class="sig-reveal"><a class="sig-tg" href="https://t.me/wish_adc" target="_blank" rel="noopener">@wish_adc</a></div>
</footer>

        var u = it.u || sec.unit;
        html += '<label class="row" data-id="'+it.id+'" data-name="'+esc(it.n.toLowerCase().replace(/ё/g,'е'))+'">'
          + '<span class="nm">'+esc(it.n)+(it.f?'<em class="tg '+it.f+'">'+(it.f==='new'?'новое':'спец')+'</em>':'')+'</span>'
          + '<span class="fld"><input class="val" data-id="'+it.id+'" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" '
          + 'placeholder="—" aria-label="Остаток: '+esc(it.n)+', '+esc(u)+'" value="'+esc(vals[it.id]==null?'':vals[it.id])+'"/>'
          + '<span class="u">'+esc(u)+'</span></span></label>';
      });
      html += '</section>';
    });
    html += '</div>';
  });
  $('app').innerHTML = html;

  var pills = '';
  DATA.tabs.forEach(function(t){ pills += '<button type="button" class="pill" data-tab="'+t.id+'">'+esc(t.title)+'<span class="n" data-tabcnt="'+t.id+'"></span></button>'; });
  $('pills').innerHTML = pills;
}

function allItems(tabObj){
  var r = [];
  (tabObj ? [tabObj] : DATA.tabs).forEach(function(t){ t.sections.forEach(function(s){ s.items.forEach(function(i){ r.push(i); }); }); });
  return r;
}

function refresh(){
  document.querySelectorAll('.row').forEach(function(r){ r.classList.toggle('filled', filled(r.getAttribute('data-id'))); });
  DATA.tabs.forEach(function(t){
    var done = 0, total = 0;
    t.sections.forEach(function(s){
      var d = s.items.filter(function(i){return filled(i.id);}).length;
      done += d; total += s.items.length;
      var el = document.querySelector('[data-cnt="'+s.id+'"]'); if(el) el.textContent = d+'/'+s.items.length;
    });
    var pc = document.querySelector('[data-tabcnt="'+t.id+'"]'); if(pc) pc.textContent = done+'/'+total;
  });
  var parts = DATA.tabs.map(function(t){ var d = allItems(t).filter(function(i){return filled(i.id);}).length; return t.title.toLowerCase()+': '+d+' из '+allItems(t).length; });
  $('sum').textContent = 'Заполнено — '+parts.join(' · ');
}

function showTab(id){
  tab = id;
  document.querySelectorAll('.pane').forEach(function(p){ p.hidden = p.getAttribute('data-tab') !== id; });
  document.querySelectorAll('.pill').forEach(function(p){ var on = p.getAttribute('data-tab') === id; p.classList.toggle('on', on); p.setAttribute('aria-pressed', on); });
  applySearch(); saveDraft();
}

function applySearch(){
  var terms = $('q').value.toLowerCase().replace(/ё/g,'е').split(/\s+/).filter(Boolean), any = false;
  document.querySelectorAll('.pane').forEach(function(p){
    if(p.hidden) return;
    p.querySelectorAll('section.group').forEach(function(g){
      var vis = 0;
      g.querySelectorAll('.row').forEach(function(r){
        var s = r.getAttribute('data-name'), ok = terms.every(function(t){ return s.indexOf(t) > -1; });
        r.hidden = !ok; if(ok) vis++;
      });
      g.hidden = !vis; if(vis) any = true;
    });
  });
  $('empty').hidden = any;
}

/* ---------- дата нужна только для имени файла ---------- */
function todayRu(){ var d = new Date(); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }

/* ---------- xlsx: вписываем значения в XML шаблона, оформление не трогаем ---------- */
function b64u8(b){ var s = atob(b), u = new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return u; }
function xesc(s){ return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function patchCell(xml, ref, val){
  var re = new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  var m = xml.match(re); if(!m) throw new Error('В шаблоне нет ячейки '+ref);
  var attrs = m[1].replace(/\s+t="[^"]*"/, '');
  var out = (typeof val === 'number')
    ? '<c r="'+ref+'"'+attrs+'><v>'+val+'</v></c>'
    : '<c r="'+ref+'"'+attrs+' t="inlineStr"><is><t xml:space="preserve">'+xesc(val)+'</t></is></c>';
  return xml.replace(re, function(){ return out; });
}
function parseVal(raw){
  var s = String(raw).trim(), n = s.replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(n) ? Number(n) : s;
}
var CRC = (function(){ var t = new Uint32Array(256); for(var n=0;n<256;n++){ var c = n; for(var k=0;k<8;k++) c = c & 1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n] = c>>>0; } return t; })();
function crc32(u){ var c = 0xFFFFFFFF; for(var i=0;i<u.length;i++) c = CRC[(c ^ u[i]) & 255] ^ (c>>>8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  var enc = new TextEncoder(), now = new Date();
  var dt = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  var dd = ((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  var total = 22, metas = files.map(function(f){ var nb = enc.encode(f.name); total += 30 + nb.length + f.data.length + 46 + nb.length; return {nb:nb, crc:crc32(f.data), data:f.data}; });
  var out = new Uint8Array(total), dv = new DataView(out.buffer), p = 0, central = [];
  metas.forEach(function(m){
    m.off = p;
    dv.setUint32(p,0x04034b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,0x0800,true); dv.setUint16(p+8,0,true);
    dv.setUint16(p+10,dt,true); dv.setUint16(p+12,dd,true); dv.setUint32(p+14,m.crc,true);
    dv.setUint32(p+18,m.data.length,true); dv.setUint32(p+22,m.data.length,true); dv.setUint16(p+26,m.nb.length,true); dv.setUint16(p+28,0,true);
    out.set(m.nb,p+30); out.set(m.data,p+30+m.nb.length); p += 30 + m.nb.length + m.data.length;
  });
  var cStart = p;
  metas.forEach(function(m){
    dv.setUint32(p,0x02014b50,true); dv.setUint16(p+4,20,true); dv.setUint16(p+6,20,true); dv.setUint16(p+8,0x0800,true); dv.setUint16(p+10,0,true);
    dv.setUint16(p+12,dt,true); dv.setUint16(p+14,dd,true); dv.setUint32(p+16,m.crc,true);
    dv.setUint32(p+20,m.data.length,true); dv.setUint32(p+24,m.data.length,true); dv.setUint16(p+28,m.nb.length,true);
    dv.setUint16(p+30,0,true); dv.setUint16(p+32,0,true); dv.setUint16(p+34,0,true); dv.setUint16(p+36,0,true); dv.setUint32(p+38,0,true); dv.setUint32(p+42,m.off,true);
    out.set(m.nb,p+46); p += 46 + m.nb.length;
  });
  dv.setUint32(p,0x06054b50,true); dv.setUint16(p+4,0,true); dv.setUint16(p+6,0,true); dv.setUint16(p+8,metas.length,true); dv.setUint16(p+10,metas.length,true);
  dv.setUint32(p+12,p-cStart,true); dv.setUint32(p+16,cStart,true); dv.setUint16(p+20,0,true);
  return out;
}
function buildXlsx(){
  var dec = new TextDecoder(), enc = new TextEncoder();
  var xml = SHEET_FILES.map(function(f){ return dec.decode(b64u8(TPL.files[f])); });
  allItems().forEach(function(it){ if(filled(it.id)) xml[it.s] = patchCell(xml[it.s], it.c, parseVal(vals[it.id])); });
  var files = TPL.order.map(function(n){
    var i = SHEET_FILES.indexOf(n);
    return {name:n, data: i > -1 ? enc.encode(xml[i]) : b64u8(TPL.files[n])};
  });
  return zipStore(files);
}
function fileName(){ return 'Инвентаризация_'+todayRu()+'.xlsx'; }

/* ---------- проверка перед отправкой ---------- */
function setMsg(text, ok){ var m = $('msg'); if(!text){ m.hidden = true; m.textContent = ''; return; } m.hidden = false; m.className = 'msg'+(ok?' ok':''); m.textContent = text; }
function validate(action){
  if(!allItems().some(function(i){return filled(i.id);})){ setMsg('Пока не вписан ни один остаток.'); return false; }
  var gaps = [];
  DATA.tabs.forEach(function(t){
    var its = allItems(t), done = its.filter(function(i){return filled(i.id);}).length;
    if(done === 0) return;                       /* этот период сегодня не считали — это нормально */
    t.sections.forEach(function(s){
      var miss = s.items.filter(function(i){return !filled(i.id);});
      if(miss.length) gaps.push({sec:s.title, items:miss});
    });
  });
  if(gaps.length && warnedFor !== action){
    var n = gaps.reduce(function(a,g){return a+g.items.length;},0);
    var lines = gaps.map(function(g){ return '«'+g.sec+'»: '+g.items.slice(0,4).map(function(i){return i.n;}).join(', ')+(g.items.length>4?' и ещё '+(g.items.length-4):''); });
    setMsg('Не вписано '+n+' поз.: '+lines.join('; ')+'. Если позиции нет, впиши 0. Нажми кнопку ещё раз, чтобы отправить как есть.');
    warnedFor = action; return false;
  }
  setMsg(''); return true;
}

/* ---------- действия ---------- */
function makeFile(){ var bytes = buildXlsx(); return {bytes:bytes, name:fileName()}; }
function doDownload(){
  if(!validate('dl')) return;
  try{
    var f = makeFile(), url = URL.createObjectURL(new Blob([f.bytes], {type:XLSX_MIME}));
    var a = document.createElement('a'); a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
    setMsg('Файл «'+f.name+'» сформирован. Если загрузка не началась (бывает во встроенных браузерах), нажми «Скопировать текстом» или открой страницу в обычном браузере.', true);
  }catch(e){ setMsg('Не получилось собрать файл: '+e.message); }
}
function doShare(){
  if(!validate('share')) return;
  try{
    var f = makeFile(), file = new File([f.bytes], f.name, {type:XLSX_MIME});
    navigator.share({files:[file], title:f.name}).then(function(){ setMsg('Готово, файл ушёл в меню отправки.', true); },
      function(err){ if(err && err.name === 'AbortError') return; setMsg('Не удалось открыть меню отправки. Нажми «Скачать .xlsx» и отправь файл вручную.'); });
  }catch(e){ setMsg('Не получилось собрать файл: '+e.message); }
}
function textReport(){
  var L = ['Инвентаризация, остатки', ''];
  DATA.tabs.forEach(function(t){ t.sections.forEach(function(s){
    var rows = s.items.filter(function(i){return filled(i.id);}); if(!rows.length) return;
    L.push(s.title.toUpperCase());
    rows.forEach(function(i){ L.push(i.n+' — '+String(vals[i.id]).trim()+' '+(i.u||s.unit)); });
    L.push('');
  }); });
  return L.join('\n').replace(/\s+$/,'');
}
function doCopy(){
  if(!validate('copy')) return;
  var t = textReport(), box = $('copybox'); box.value = t; box.hidden = false;
  function fallback(){ box.focus(); box.select(); try{ document.execCommand('copy'); setMsg('Скопировано. Если не вставляется, выдели текст ниже и скопируй вручную.', true); }catch(e){ setMsg('Выдели текст ниже и скопируй вручную.'); } }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ setMsg('Скопировано, вставь в чат.', true); }, fallback); } else fallback();
}
var clearTimer = null;
function doClear(){
  var b = $('btnClear');
  if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent = 'Точно очистить все остатки?'; clearTimer = setTimeout(disarm, 4000); return; }
  disarm(); vals = {}; document.querySelectorAll('.val').forEach(function(i){ i.value = ''; });
  $('copybox').hidden = true; warnedFor = null; setMsg(''); saveDraft(); refresh();
}
function disarm(){ clearTimeout(clearTimer); var b = $('btnClear'); b.classList.remove('arm'); b.textContent = 'Очистить остатки'; }

/* ---------- запуск ---------- */
render();
$('app').addEventListener('input', function(e){
  var t = e.target; if(!t.classList.contains('val')) return;
  vals[t.getAttribute('data-id')] = t.value; warnedFor = null; saveDraft(); refresh();
});
$('app').addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || !e.target.classList.contains('val')) return;
  e.preventDefault();
  var all = Array.prototype.slice.call(document.querySelectorAll('.pane:not([hidden]) .row:not([hidden]) .val')), i = all.indexOf(e.target);
  if(all[i+1]) all[i+1].focus(); else e.target.blur();
});
$('pills').addEventListener('click', function(e){ var b = e.target.closest('.pill'); if(b) showTab(b.getAttribute('data-tab')); });
$('q').addEventListener('input', applySearch);
$('btnDl').addEventListener('click', doDownload);
$('btnShare').addEventListener('click', doShare);
$('btnCopy').addEventListener('click', doCopy);
$('btnClear').addEventListener('click', doClear);
try{
  var probe = new File([new Uint8Array(1)], 'a.xlsx', {type:XLSX_MIME});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[probe]})){ $('btnShare').hidden = false; $('btnDl').classList.remove('primary'); }
  else $('btnDl').classList.add('primary');
}catch(e){ $('btnDl').classList.add('primary'); }
refresh(); showTab(DATA.tabs.some(function(t){return t.id===tab;}) ? tab : DATA.tabs[0].id);
})();
</script>
</body>
